[project]
name = "sovern-cli"
version = "0.1.0"
description = "Official CLI for SovernStack"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.scripts]
sovern = "sovern_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"